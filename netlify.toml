# Netlify build configuration — migrated from Vercel (Sept 2026).
# Blythe Diva: Next.js 14.2.5 App Router. middleware.ts does host-based rewrites for
# blythediva.com / trade.blythediva.com / admin-bd.blythediva.com — all three hostnames
# must stay attached to THIS one Netlify site as domain aliases.
#
# The admin VersionWatcher reads VERCEL_GIT_COMMIT_SHA; Netlify's equivalent build
# variable is COMMIT_REF, so it is mapped in the build command below.

# Hosted on Netlify — not Vercel. Serverless functions default to a short timeout
# (10s on many plans). Product Save / AI copy must finish inside that budget;
# `maxDuration` in route files is a Vercel-only hint and is ignored here.

[build]
  command = "VERCEL_GIT_COMMIT_SHA=$COMMIT_REF npm run build"
  publish = ".next"
  # Cost control (Oct 2026): every production build costs Netlify credits. Skip the build when a push
  # only touches files the live site never uses (docs, DB migrations, tests, CI, scripts). Exit code 0 =
  # "nothing to build". A commit message containing [skip netlify] also skips, as before.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)supabase/' ':(exclude)tests/' ':(exclude).github/' ':(exclude)scripts/' ':(exclude)docs/'"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
